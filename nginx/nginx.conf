upstream api  { server api:4000; }
upstream web  { server web:3000; }

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=public:10m  rate=100r/m;
limit_req_zone $binary_remote_addr zone=auth:10m    rate=20r/m;

server {
    listen 80;
    server_name yourdomain.vn www.yourdomain.vn;

    # Redirect to HTTPS in production
    # return 301 https://$host$request_uri;

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=public burst=20 nodelay;
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Stricter rate limit on auth endpoints
    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://api;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Frontend ─────────────────────────────────────────────────────────────
    location / {
        limit_req zone=public burst=50 nodelay;
        proxy_pass         http://web;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Static assets — long cache
    location /_next/static/ {
        proxy_pass         http://web;
        proxy_cache_valid  200 365d;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }

    # Health check
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}

# ── MinIO (CDN) ───────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name cdn.yourdomain.vn;

    location / {
        proxy_pass         http://minio:9000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
