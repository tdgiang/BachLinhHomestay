upstream api  { server api:4000; }
upstream web  { server web:3000; }

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=public:10m  rate=100r/m;
limit_req_zone $binary_remote_addr zone=auth:10m    rate=20r/m;

# ── HTTP: redirect all traffic to HTTPS ───────────────────────────────────────
server {
    listen 80;
    server_name bachlinh.com.vn www.bachlinh.com.vn cdn.bachlinh.com.vn;

    # Let's Encrypt renewal challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: main site ──────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name bachlinh.com.vn www.bachlinh.com.vn;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Modern TLS only
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    # HSTS (1 year — chỉ bật sau khi chắc chắn HTTPS hoạt động tốt)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── NestJS API (/api/v1/) ────────────────────────────────────────────────
    location /api/v1/ {
        limit_req zone=public burst=20 nodelay;
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Stricter rate limit on auth endpoints
    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass       http://api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Next.js API routes (NextAuth, /api/auth/, etc.) ──────────────────────
    location /api/ {
        limit_req zone=public burst=20 nodelay;
        proxy_pass         http://web;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Frontend ─────────────────────────────────────────────────────────────
    location / {
        limit_req zone=public burst=50 nodelay;
        proxy_pass         http://web;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Static assets — long cache
    location /_next/static/ {
        proxy_pass http://web;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Health check
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}

# ── HTTPS: MinIO CDN ──────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name cdn.bachlinh.com.vn;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass       http://minio:9000;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
