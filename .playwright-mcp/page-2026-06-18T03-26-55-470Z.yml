                  - listitem [ref=e109]: Bằng việc đăng ký tài khoản hoặc thực hiện đặt phòng, bạn xác nhận đã đọc, hiểu và đồng ý ràng buộc bởi các điều khoản này.
                  - listitem [ref=e111]: Ba.Li Homestay có quyền cập nhật điều khoản bất kỳ lúc nào. Thay đổi có hiệu lực ngay khi đăng tải trên website. Việc tiếp tục sử dụng dịch vụ đồng nghĩa với việc chấp thuận điều khoản mới.
