version: '3.9'

services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       homestay
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "homestay"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (no password for local) ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (exposed for direct browser access) ────────────────────────────────
  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"   # S3 API — accessible at http://localhost:9000
      - "9001:9001"   # MinIO Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Backend API ───────────────────────────────────────────────────────────────
  api:
    build:
      context: ./src/backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      NODE_ENV:               production
      PORT:                   4000
      DATABASE_URL:           postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/homestay?schema=public
      REDIS_HOST:             redis
      REDIS_PORT:             6379
      REDIS_PASSWORD:         ""
      JWT_SECRET:             ${JWT_SECRET}
      JWT_REFRESH_SECRET:     ${JWT_REFRESH_SECRET}
      JWT_EXPIRATION:         15m
      JWT_REFRESH_EXPIRATION: 30d
      CORS_ORIGIN:            http://localhost
      MINIO_ENDPOINT:         minio
      MINIO_PORT:             9000
      MINIO_USE_SSL:          "false"
      MINIO_ACCESS_KEY:       ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY:       ${MINIO_SECRET_KEY}
      MINIO_BUCKET:           homestay-images
      VNPAY_TMN_CODE:         ${VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET:      ${VNPAY_HASH_SECRET}
      VNPAY_URL:              ${VNPAY_URL}
      VNPAY_RETURN_URL:       http://localhost/payment/callback
      VNPAY_IPN_URL:          http://localhost/api/v1/payments/vnpay/ipn
      PUBLIC_URL:             http://localhost:9000
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/branches > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Frontend ──────────────────────────────────────────────────────────────────
  web:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL:  http://localhost
        NEXT_PUBLIC_SITE_URL: http://localhost
        AUTH_SECRET:          ${AUTH_SECRET}
    restart: unless-stopped
    environment:
      NODE_ENV:             production
      NEXT_PUBLIC_API_URL:  http://localhost
      NEXT_PUBLIC_SITE_URL: http://localhost
      NEXT_PUBLIC_USE_MOCK: "false"
      AUTH_SECRET:          ${AUTH_SECRET}
      AUTH_URL:             http://localhost
      API_INTERNAL_URL:     http://api:4000
    depends_on:
      api: { condition: service_started }

  # ── Nginx ─────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  redis_data:
  minio_data:
