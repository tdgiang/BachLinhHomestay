version: '3.9'

services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       homestay
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "homestay"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO ────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Backend API ───────────────────────────────────────────────────────────────
  api:
    build:
      context: ./src/backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      NODE_ENV:                production
      PORT:                    4000
      DATABASE_URL:            postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/homestay?schema=public
      REDIS_HOST:              redis
      REDIS_PORT:              6379
      REDIS_PASSWORD:          ${REDIS_PASSWORD}
      JWT_SECRET:              ${JWT_SECRET}
      JWT_REFRESH_SECRET:      ${JWT_REFRESH_SECRET}
      JWT_EXPIRATION:          15m
      JWT_REFRESH_EXPIRATION:  30d
      CORS_ORIGIN:             ${SITE_URL}
      MINIO_ENDPOINT:          minio
      MINIO_PORT:              9000
      MINIO_USE_SSL:           false
      MINIO_ACCESS_KEY:        ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY:        ${MINIO_SECRET_KEY}
      MINIO_BUCKET:            homestay-images
      VNPAY_TMN_CODE:          ${VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET:       ${VNPAY_HASH_SECRET}
      VNPAY_URL:               ${VNPAY_URL}
      VNPAY_RETURN_URL:        ${SITE_URL}/payment/callback
      VNPAY_IPN_URL:           ${API_URL}/api/v1/payments/vnpay/ipn
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/auth/me"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend ──────────────────────────────────────────────────────────────────
  web:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL:  ${API_URL}
        NEXT_PUBLIC_SITE_URL: ${SITE_URL}
        AUTH_SECRET:          ${AUTH_SECRET}
    restart: unless-stopped
    environment:
      NODE_ENV:                production
      NEXT_PUBLIC_API_URL:     ${API_URL}
      NEXT_PUBLIC_SITE_URL:    ${SITE_URL}
      NEXT_PUBLIC_USE_MOCK:    false
      AUTH_SECRET:             ${AUTH_SECRET}
      AUTH_URL:                ${SITE_URL}
    depends_on:
      api: { condition: service_healthy }

  # ── Nginx ─────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro        # mount SSL certs
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  redis_data:
  minio_data:
